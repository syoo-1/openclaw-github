version: rules-yaml-min-v1
status: active
principle: "最小字段、机器可读、逐步压缩旧长规则，不再继续手工扩写长规则。"

rules:
  - id: R001
    title: 达到阶段阈值后停止加法
    scope: system_build
    trigger: 阶段规则、记忆、结构开始变厚或重复时
    action: 停止新增长规则，转入 rules.yaml 最小字段压缩
    priority: high
    status: active
    source: 2026-05-01 当前收口原则

  - id: R002
    title: 新规则优先结构化承接
    scope: rule_system
    trigger: 需要新增规则、原则、判断尺时
    action: 优先写入 rules.yaml 条目，不再新建手工长规则文件
    priority: high
    status: active
    source: 2026-05-01 当前收口原则

  - id: R003
    title: 旧长规则只做映射不继续扩张
    scope: rule_migration
    trigger: 处理既有长规则文件时
    action: 只抽取关键触发、动作、优先级、状态，映射进 rules.yaml
    priority: high
    status: active
    source: 2026-05-01 当前收口原则

  - id: R004
    title: 02 准入规则
    scope: governance_admission
    trigger: 判断新内容是否应进入 02-brain 正式层时
    action: 按长期记忆、主线保持、壳无关迁移价值、贴合但不迎合四问进行准入判断
    priority: high
    status: active
    source: 00-GOVERNANCE/02-准入规则.md

  - id: R005
    title: 02 状态分层规则
    scope: governance_layering
    trigger: 判断材料应进入 Raw、Compiled、Adapter、Draft、Retired 或 Thrown-Away 时
    action: 按状态分层规则归位，避免草稿、来源、正式规则混层
    priority: high
    status: active
    source: 00-GOVERNANCE/02-状态分层规则.md

  - id: R006
    title: Core 能力触发与回归规则
    scope: core_capability_routing
    trigger: Core 需要调用 Gemma4、Kimi、GPT-5.4 或回归主脑判断时
    action: 暂作 Core 能力调度来源索引；因其属于 Core 具体调用策略，不升为 02 总规则，实际调用仍须回归主脑裁定
    priority: high
    status: mapped
    source: 08-IMPORT-STAGING/FROM-CORE-LIVE/CORE-能力触发与回归规则-V1.md

  - id: R007
    title: 主脑唯一与可回滚原则
    scope: brain_sovereignty
    trigger: 判断系统真源、主脑数量、回滚能力时
    action: 暂作旧来源索引；因“主脑唯一”需先与 PG 独立脑系、Core/02/GitHub-02 同脑三位口径对齐，暂不扶正
    priority: high
    status: mapped
    source: 08-IMPORT-STAGING/FROM-OLD-02/001-主脑唯一与可回滚原则.md

  - id: R008
    title: 主脑主权原则
    scope: brain_sovereignty
    trigger: 壳、运行体、前层记忆与主脑发生权威冲突时
    action: 暂作旧来源索引；因其与现行“02-brain 唯一主脑、OpenClaw/Obsidian 共用入口”口径需再对齐，暂不扶正
    priority: high
    status: mapped
    source: 08-IMPORT-STAGING/FROM-OLD-02/主脑主权原则-V1.md

  - id: R009
    title: 同步控制权原则
    scope: sync_governance
    trigger: 母本化阶段判断同步方向、自动回流、运行体写回时
    action: 暂作阶段性同步治理索引；因其属于母本化阶段控制规则，未确认长期适用前不升 active
    priority: high
    status: mapped
    source: 08-IMPORT-STAGING/FROM-OLD-02/同步控制权原则-母本化阶段.md

  - id: R010
    title: 最小读取与节约 Token 原则
    scope: reading_policy
    trigger: 需要读取主脑材料、规则、上下文或来源文件时
    action: 默认最小读取，按需展开，不把大范围读取作为默认动作
    priority: high
    status: active
    source: 08-IMPORT-STAGING/FROM-OLD-02/最小读取与节约Token原则.md

  - id: R011
    title: 切壳成功的现实验收标准
    scope: shell_switch_acceptance
    trigger: 判断新壳、切壳、换模型或迁移入口是否基本通过时
    action: 暂作旧来源索引；保留“接上主脑、续上主线、读对关键层”的验收思想，但旧 Brain-Canonical 路径不得直接继承
    priority: high
    status: mapped
    source: 08-IMPORT-STAGING/FROM-OLD-02/轮值成功标准-现实版.md
